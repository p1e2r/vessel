name: Build & release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
      - name: Build Vessel.app
        run: ./build-mac.sh ${{ matrix.arch }}
      - name: Rename zip
        run: |
          case "${{ matrix.arch }}" in
            arm64) mv dist/Vessel-arm64.zip "dist/Vessel-macOS-AppleSilicon.zip" ;;
            x86_64) mv dist/Vessel-x86_64.zip "dist/Vessel-macOS-Intel.zip" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: vessel-${{ matrix.arch }}
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Version
        id: v
        run: |
          base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2 | cut -d. -f1,2)
          echo "tag=v${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Vessel ${{ steps.v.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          body: |
            Unzip, drag **Vessel.app** to Applications. First launch: right-click → Open (the app is ad-hoc signed).
            - **Vessel-macOS-AppleSilicon.zip** — M1/M2/M3/M4 Macs
            - **Vessel-macOS-Intel.zip** — Intel Macs
          files: dist/*.zip
