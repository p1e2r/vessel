# SPDX-License-Identifier: MIT
# Builds Vessel on macOS for every push and pull request.
#
# Branches:
#   dev  — day-to-day development: built and tested, nothing published.
#   main — releases: every push publishes the next version (see `release`).
name: Build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Work out this build's version once, so the app, its file names and the
  # release all agree.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick the version
        id: pick
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            IFS=. read -r major minor patch <<< "$base"
            # The next version without a release. If GitHub can't be asked,
            # stop here rather than guess (pipefail makes a failed call fail the job).
            tags=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')
            while grep -qx "v$major.$minor.$patch" <<< "$tags"; do
              patch=$((patch + 1))
            done
            version="$major.$minor.$patch"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Vessel $version"

  build:
    needs: version
    env:
      VESSEL_VERSION: ${{ needs.version.outputs.version }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos

      - name: Test
        run: cargo test --release --bins

      - name: Package (Apple Silicon + Intel .dmg)
        run: scripts/build-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: vessel-macos
          path: dist/*.dmg

  # Every push to main is published as the next release (x.y.z), marked as
  # GitHub's "Latest" release (pushes to dev only build and test):
  #   push to main → the version in Cargo.toml; if that version is already
  #                  released, the next free patch number (0.1.0 → 0.1.1 → …)
  #   version tag  → that version
  # Bump the major/minor version in Cargo.toml for bigger changes.
  release:
    if: ${{ !cancelled() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [version, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release (marked as latest)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Nothing built, nothing to publish"
            exit 0
          fi
          (cd dist && sha256sum -- * > SHA256SUMS)
          files=(dist/*)
          args=(--latest --title "Vessel $VERSION" --generate-notes)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "v$VERSION" "${files[@]}" -R "$REPO" "${args[@]}"
